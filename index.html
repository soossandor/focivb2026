    const propagateAllWinners = (bracket) => {
      for (const key in bracket) {
        if (defaultBracketMatches[key]) {
          bracket[key].teamA = defaultBracketMatches[key].teamA;
          bracket[key].teamB = defaultBracketMatches[key].teamB;
        }
      }
      const sortedKeys = Object.keys(bracket).sort((x, y) => parseInt(x.slice(1)) - parseInt(y.slice(1)));
      for (const key of sortedKeys) {
        const m = bracket[key];
        if (m.winner) {
          const nextId = m.nextMatch;
          const slot = m.slot;
          if (nextId && slot && bracket[nextId]) {
            bracket[nextId][slot] = m.winner;
          }
        }
      }
    };

    const parseDateTimeLocal = (str) => {
      const parts = str.split('T');
      const dateParts = parts[0].split('-');
      const timeParts = parts[1].split(':');
      return { year: parseInt(dateParts[0]), month: parseInt(dateParts[1]), day: parseInt(dateParts[2]), hour: parseInt(timeParts[0]), minute: parseInt(timeParts[1]) };
    };

    const getDateTimeMinutes = (dtStr) => {
      const { year, month, day, hour, minute } = parseDateTimeLocal(dtStr);
      const daysInMonths = [0, 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
      let adjustedDay = day, adjustedHour = hour, adjustedMonth = month;
      if (hour < 6) {
        adjustedHour = hour + 24;
        adjustedDay = day - 1;
        if (adjustedDay === 0) { adjustedMonth = month - 1; adjustedDay = daysInMonths[adjustedMonth]; }
      }
      let totalDays = adjustedDay;
      for (let i = 1; i < adjustedMonth; i++) { totalDays += daysInMonths[i]; }
      return totalDays * 24 * 60 + adjustedHour * 60 + minute;
    };

    const getMatchTournamentDayKey = (dtStr) => {
      let { year, month, day, hour } = parseDateTimeLocal(dtStr);
      if (hour < 6) {
        day -= 1;
        if (day === 0) {
          month -= 1;
          const daysInMonths = [0, 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
          day = daysInMonths[month];
          if (month === 0) { month = 12; year -= 1; }
        }
      }
      return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    };

    const getFormattedGroupHeaderDate = (keyStr) => {
      const [year, month, day] = keyStr.split('-').map(Number);
      const dateObj = new Date(year, month - 1, day);
      return dateObj.toLocaleDateString('hu-HU', { month: 'long', day: 'numeric', weekday: 'long' });
    };

    const getLivePhaseText = (period) => {
      switch(period) {
        case 1: return '1. FÉLIDŐ';
        case 2: return '2. FÉLIDŐ';
        case 3: return 'HOSSZ. 1. FÉLIDŐ';
        case 4: return 'HOSSZ. 2. FÉLIDŐ';
        case 5: return '11-ESEK';
        default: return 'ÉLŐ';
      }
    };

    const renderBracketCard = (matchId) => {
      const b = state.liveState?.bracket || defaultBracketMatches;
      const m = b[matchId];
      if (!m) return '';

      const isASelected = m.winner && m.winner === m.teamA;
      const isBSelected = m.winner && m.winner === m.teamB;
      const isAPlaceholder = isPlaceholder(m.teamA);
      const isBPlaceholder = isPlaceholder(m.teamB);
      const livePeriod = m.livePeriod !== undefined ? m.livePeriod : 1;

      return `
        <div class="bg-white dark:bg-slate-900 border rounded-xl p-3 shadow-sm dark:shadow-md transition-all duration-200 relative overflow-hidden w-60 sm:w-64 ${m.isLive ? 'border-rose-500 dark:border-rose-500 ring-1 ring-rose-500/30' : 'border-slate-200 dark:border-slate-800 hover:border-emerald-500/40'}">
          <div class="flex items-center justify-between text-[9px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-2 border-b border-slate-100 dark:border-slate-800/50 pb-1">
            <span>${m.id} • ${m.date} <span class="text-emerald-600 dark:text-emerald-400 ml-1 bg-emerald-500/10 px-1 py-0.5 rounded font-mono">${m.time}</span></span>
            ${m.isLive ? `<span class="text-rose-500 font-black animate-pulse bg-rose-500/10 px-1.5 py-0.5 rounded">${getLivePhaseText(livePeriod)}</span>` : m.winner ? '<span class="text-emerald-500 font-black">VÉGE</span>' : `<span class="truncate max-w-[65px]">${m.venue}</span>`}
          </div>
          <div class="space-y-1.5 relative">
            <div class="flex items-center justify-between p-1.5 rounded-lg ${isASelected ? 'bg-emerald-500/10 border border-emerald-500/20' : 'bg-slate-50 dark:bg-slate-950/40'}">
              <span class="text-xs truncate max-w-[120px] ${isASelected ? 'text-emerald-600 dark:text-emerald-400 font-black' : isAPlaceholder ? 'text-slate-400 italic' : 'text-slate-800 dark:text-slate-100 font-bold'}">${m.teamA}</span>
              <div class="flex items-center space-x-1 font-mono">
                ${m.penaltiesA !== "" && (m.winner || livePeriod === 5) ? `<span class="text-[9px] text-amber-500 font-black">(${m.penaltiesA})</span>` : ''}
                <span class="text-xs font-black bg-slate-100 dark:bg-slate-950 px-1.5 py-0.5 rounded border border-slate-200 dark:border-slate-800">${m.scoreA !== "" ? m.scoreA : "–"}</span>
              </div>
            </div>
            <div class="flex items-center justify-between p-1.5 rounded-lg ${isBSelected ? 'bg-emerald-500/10 border border-emerald-500/20' : 'bg-slate-50 dark:bg-slate-950/40'}">
              <span class="text-xs truncate max-w-[130px] ${isBSelected ? 'text-emerald-600 dark:text-emerald-400 font-black' : isBPlaceholder ? 'text-slate-400 italic' : 'text-slate-800 dark:text-slate-100 font-bold'}">${m.teamB}</span>
              <div class="flex items-center space-x-1 font-mono">
                ${m.penaltiesB !== "" && (m.winner || livePeriod === 5) ? `<span class="text-[9px] text-amber-500 font-black">(${m.penaltiesB})</span>` : ''}
                <span class="text-xs font-black bg-slate-100 dark:bg-slate-950 px-1.5 py-0.5 rounded border border-slate-200 dark:border-slate-800">${m.scoreB !== "" ? m.scoreB : "–"}</span>
              </div>
            </div>
          </div>
        </div>
      `;
    };

    // HAJSZÁLPONTOSAN IGAZÍTOTT VÍZSZINTES FA-ÁGRAJZ STRUKTÚRA RENDERELŐ
    const renderCascadingBlock = (mId1, mId2, nextId1, mId3, mId4, nextId2, qfId) => {

      const container = document.getElementById('app');

      let html = `

          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">

                <i data-lucide="flame" class="w-6 h-6 animate-pulse"></i>
              </div>
              <div>
                <h1 class="font-black text-lg tracking-wider bg-gradient-to-r bg-clip-text text-transparent from-emerald-600 to-teal-500 dark:from-emerald-400 dark:to-teal-200">FIFA VB 2026</h1>
                <p class="text-[10px] text-slate-500 dark:text-slate-400 font-semibold tracking-widest uppercase">Élő Rendszer</p>
              </div>
            </div>

            <div class="flex items-center space-x-2 sm:space-x-3">

        const mId = e.target.dataset.match, side = e.target.dataset.penSide;
        if (!state.liveState) state.liveState = { bracket: JSON.parse(JSON.stringify(defaultBracketMatches)) };
        state.liveState.bracket[mId]['penalties' + side] = e.target.value;
      }
    });

    const getMatchDateTimeString = (m) => {
      if (m.datetime) return m.datetime;
      const defMatch = defaultBracketMatches[m.id];
      return defMatch ? defMatch.datetime : "2026-11-31T00:00";
    };

    async function saveToCloud() {
      state.isPublishing = true; 
      state.statusMessage = { type: 'success', text: 'Szinkronizálás folyamatban...' }; 
      render();
      try {
        const docRef = doc(db, 'artifacts', state.appId, 'public', 'data', 'live_state', 'current');
        const cleanedBracket = JSON.parse(JSON.stringify(state.liveState?.bracket || defaultBracketMatches));
        await setDoc(docRef, { bracket: cleanedBracket, updatedAt: new Date().toISOString() });
        state.statusMessage = { type: 'success', text: 'Sikeresen szinkronizálva az adatbázissal!' };
      } catch(err) {
        state.statusMessage = { type: 'error', text: 'Hiba: ' + err.message };
      } finally { 
        state.isPublishing = false; 
        render(); 
      }
    }

    window.onload = async () => {
      state.theme = localStorage.getItem('vb_2026_theme') || 'light';
      document.documentElement.className = state.theme;
      state.liveState = { bracket: JSON.parse(JSON.stringify(defaultBracketMatches)) };
      render();

      let config = null;
      try {
        const apiRes = await fetch('/api/config');
        if (apiRes.ok) {
          const apiData = await apiRes.json();
          if (apiData && apiData.firebaseConfig) {
            config = typeof apiData.firebaseConfig === 'string' ? JSON.parse(apiData.firebaseConfig) : apiData.firebaseConfig;
            state.appId = apiData.appId || 'foci-vb-2026';
          }
        }
      } catch (err) {}

      if (!config) {
        const localConfig = localStorage.getItem('vb_2026_firebase_config');
        if (localConfig) { config = JSON.parse(localConfig); state.appId = localStorage.getItem('vb_2026_appid') || 'foci-vb-2026'; }
      }

      if (!config) return;

      try {
        const app = initializeApp(config);
        auth = getAuth(app);
        db = getFirestore(app);
        await signInAnonymously(auth);

        const docRef = doc(db, 'artifacts', state.appId, 'public', 'data', 'live_state', 'current');
        onSnapshot(docRef, (docSnap) => {
          if (docSnap.exists()) {
            const data = docSnap.data();
            if (data && data.bracket) {
              for (const key in data.bracket) {
                if (defaultBracketMatches[key]) {
                  data.bracket[key].date = defaultBracketMatches[key].date;
                  data.bracket[key].time = defaultBracketMatches[key].time;
                  data.bracket[key].datetime = defaultBracketMatches[key].datetime;
                  data.bracket[key].venue = defaultBracketMatches[key].venue;
                  data.bracket[key].nextMatch = defaultBracketMatches[key].nextMatch;
                  data.bracket[key].slot = defaultBracketMatches[key].slot;
                }
              }
              propagateAllWinners(data.bracket);
            }
            state.liveState = data;
          }
          state.isConnected = true;
          render();
        });
      } catch (err) { console.error(err); }
    };
  </script>
</body>
</html>
