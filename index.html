    // --- AUTOMATIKUS GYŐZTES TOVÁBBJUTTATÓ MOTOR ---
    const propagateAllWinners = (bracket) => {
      for (const key in bracket) {
        if (defaultBracketMatches[key]) {
          bracket[key].teamA = defaultBracketMatches[key].teamA;
          bracket[key].teamB = defaultBracketMatches[key].teamB;
        }
      }
      const sortedKeys = Object.keys(bracket).sort((x, y) => parseInt(x.slice(1)) - parseInt(y.slice(1)));
      for (const key of sortedKeys) {
        const m = bracket[key];
        if (m.winner) {
          const nextId = m.nextMatch;
          const slot = m.slot;
          if (nextId && slot && bracket[nextId]) {
            bracket[nextId][slot] = m.winner;
          }
        }
      }
    };

    // --- ROBUSZTUS, IDŐZÓNA-FÜGGETLEN DÁTUM- ÉS IDŐKEZELŐ ---
    const parseDateTimeLocal = (str) => {
      const parts = str.split('T');
      const dateParts = parts[0].split('-');
      const timeParts = parts[1].split(':');
      return {
        year: parseInt(dateParts[0]),
        month: parseInt(dateParts[1]),
        day: parseInt(dateParts[2]),
        hour: parseInt(timeParts[0]),
        minute: parseInt(timeParts[1])
      };
    };

    const getDateTimeMinutes = (dtStr) => {
      const { year, month, day, hour, minute } = parseDateTimeLocal(dtStr);
      const daysInMonths = [0, 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
      
      let adjustedDay = day;
      let adjustedHour = hour;
      let adjustedMonth = month;
      
      if (hour < 6) {
        adjustedHour = hour + 24;
        adjustedDay = day - 1;
        if (adjustedDay === 0) {
          adjustedMonth = month - 1;
          adjustedDay = daysInMonths[adjustedMonth];
        }
      }
      
      let totalDays = adjustedDay;
      for (let i = 1; i < adjustedMonth; i++) {
        totalDays += daysInMonths[i];
      }
      return totalDays * 24 * 60 + adjustedHour * 60 + minute;
    };

    const getMatchTournamentDayKey = (dtStr) => {
      let { year, month, day, hour } = parseDateTimeLocal(dtStr);
      if (hour < 6) {
        day -= 1;
        if (day === 0) {
          month -= 1;
          const daysInMonths = [0, 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
          day = daysInMonths[month];
          if (month === 0) {
            month = 12;
            year -= 1;
          }
        }
      }
      return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    };

    const getFormattedGroupHeaderDate = (keyStr) => {
      const [year, month, day] = keyStr.split('-').map(Number);
      const dateObj = new Date(year, month - 1, day);
      return dateObj.toLocaleDateString('hu-HU', { month: 'long', day: 'numeric', weekday: 'long' });
    };

    // 5 FÁZISÚ ÉLŐ SZÖVEG MEGJELENÍTŐ HELPER
    const getLivePhaseText = (period) => {
      switch(period) {
        case 1: return '1. FÉLIDŐ';
        case 2: return '2. FÉLIDŐ';
        case 3: return 'HOSSZ. 1. FÉLIDŐ';
        case 4: return 'HOSSZ. 2. FÉLIDŐ';
        case 5: return '11-ESEK';
        default: return 'ÉLŐ';
      }
    };

      const b = state.liveState?.bracket || defaultBracketMatches;
      const m = b[matchId];
      if (!m) return '';

      const isASelected = m.winner && m.winner === m.teamA;
      const isBSelected = m.winner && m.winner === m.teamB;

      const isAPlaceholder = isPlaceholder(m.teamA);
      const isBPlaceholder = isPlaceholder(m.teamB);

      const livePeriod = m.livePeriod !== undefined ? m.livePeriod : 1;

            ? 'border-rose-500 dark:border-rose-500 shadow-rose-500/10 ring-1 ring-rose-500/30'

        }">

            <span class="flex items-center gap-1.5">
              <span>${m.id} • ${m.date || 'Dátum'}</span>

            </span>
            ${m.isLive ? `
              <span class="flex items-center gap-1 text-rose-500 font-black tracking-widest animate-pulse text-[8px] bg-rose-500/10 px-1.5 py-0.5 rounded">
                <span>${getLivePhaseText(livePeriod)}</span>
              </span>
            ` : m.winner ? `
              <span class="text-emerald-600 dark:text-emerald-400 text-[8px] font-black tracking-wide">VÉGE</span>
            ` : `
              <span class="text-slate-400 dark:text-slate-500 font-mono text-[8px]">${m.venue || 'Helyszín'}</span>

              }">${m.teamA}</span>
              <div class="flex items-center space-x-1">
                ${(m.penaltiesA !== "" && (m.winner || livePeriod === 5)) ? `<span class="text-[9px] font-black text-amber-500">(${m.penaltiesA})</span>` : ''}
                <span class="text-xs font-black text-slate-800 dark:text-white font-mono bg-slate-100 dark:bg-slate-950 px-1.5 py-0.5 rounded border border-slate-200 dark:border-slate-800">${m.scoreA !== "" ? m.scoreA : "–"}</span>
              </div>
            </div>
            <div class="flex items-center justify-between p-1.5 rounded-lg transition-colors ${isBSelected ? 'bg-emerald-500/10 border border-emerald-500/20' : 'bg-slate-50 dark:bg-slate-950/40'}">

      let html = `
