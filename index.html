      M98: { id: "M98", date: "júl 10.", time: "02:00 (júl. 11.)", teamA: "Nyertes M91", teamB: "Nyertes M92", scoreA: "", scoreB: "", winner: "", nextMatch: "M101", slot: "teamB" },
      M99: { id: "M99", date: "júl 10.", time: "22:00", teamA: "Nyertes M93", teamB: "Nyertes M94", scoreA: "", scoreB: "", winner: "", nextMatch: "M102", slot: "teamA" },
      M100: { id: "M100", date: "júl 11.", time: "02:00 (júl. 12.)", teamA: "Nyertes M95", teamB: "Nyertes M96", scoreA: "", scoreB: "", winner: "M102", slot: "teamB" },

      // ELŐDÖNTŐK (Semifinals)
      M101: { id: "M101", date: "júl 14.", time: "22:00", teamA: "Nyertes M97", teamB: "Nyertes M98", scoreA: "", scoreB: "", winner: "M104", slot: "teamA" },
      M102: { id: "M102", date: "júl 15.", time: "22:00", teamA: "Nyertes M99", teamB: "Nyertes M100", scoreA: "", scoreB: "", winner: "M104", slot: "teamB" },

      // DÖNTŐ ÉS HARMADIK HELYÉRT
      M104: { id: "M104", date: "júl 19.", time: "21:00", venue: "New York/NJ", teamA: "Nyertes M101", teamB: "Nyertes M102", scoreA: "", scoreB: "", winner: "" },
      M103: { id: "M103", date: "júl 18.", time: "22:00", venue: "Miami (Bronz)", teamA: "Vesztes M101", teamB: "Vesztes M102", scoreA: "", scoreB: "", winner: "" }
    };

    const addLog = (message, type = 'info') => {
      const time = new Date().toLocaleTimeString('hu-HU');
      state.apiLogs = [{ time, message, type }, ...state.apiLogs].slice(0, 15);
      render();
    };

    // --- HELYŐRZŐ SZŰRŐ (VALÓS CSAPAT VS NYERTES MXX) ---
    const isPlaceholder = (name) => {
      if (!name) return true;
      const lower = name.toLowerCase();
      return lower.includes('nyertes') || lower.includes('vesztes') || lower.includes('csoport') || lower.includes('helyezett') || lower.includes('hely');
    };

    // --- KRONOLÓGIAI PARSER (MAGYAR IDŐ/CEST SZERINT) ---
    const parseMatchDateTime = (dateStr, timeStr) => {
      if (!dateStr) return new Date(2026, 11, 31);
      
      let month = 5; // június alapértelmezett indexe: 5
      let day = 1;
      
      // 1. Ellenőrizzük, hogy a 'time' mező tartalmaz-e zárójeles valós magyar napot, pl. "(júl. 1.)"
      const parenMatch = timeStr ? timeStr.match(/\((jún|júl)\.?\s*(\d+)\.?\)/) : null;
      if (parenMatch) {
        month = parenMatch[1] === 'júl' ? 6 : 5;
        day = parseInt(parenMatch[2]);
      } else {
        // Ha nincs zárójeles kiegészítő, a fő dátum mezőből nyerjük ki a napot
        month = dateStr.includes('júl') ? 6 : 5;
        const dayMatch = dateStr.match(/\d+/);
        day = dayMatch ? parseInt(dayMatch[0]) : 1;
      }

      let hour = 0, minute = 0;
      if (timeStr) {
        const timeMatch = timeStr.match(/^(\d+):(\d+)/);
        if (timeMatch) {
          hour = parseInt(timeMatch[1]);
          minute = parseInt(timeMatch[2]);
        }
      }
      return new Date(2026, month, day, hour, minute);
    };

    // --- TORNA JÁTÉKNAP SZÁMÍTÓ (HAJNALI ELTOLÓDÁS KEZELÉSE) ---
    // Ha a meccs magyar idő szerint hajnali 0:00 és 5:59 között kezdődik,
    // akkor azt az előző nap esti meccseihez csoportosítjuk (mivel azonos amerikai játéknap)
    const getTournamentDay = (dateObj) => {
      const cloned = new Date(dateObj.getTime());
      if (cloned.getHours() < 6) {
        cloned.setDate(cloned.getDate() - 1);
      }
      return cloned;
    };

    // --- PARSER: MARKDOWN TO JSON ---
    const parseMarkdownToJSON = (md) => {
      if (!md) return null;
      const data = {
        lastUpdated: new Date().toLocaleTimeString('hu-HU', { hour: '2-digit', minute: '2-digit' }) + ' (CEST)',
        ceremonies: [],
        matches: []
      };

      const ceremonies = md.matchAll(/## 🎭 Kiemelt Esemény: ([^\n]+)([\s\S]*?)(?=(## 🎭|## 📅|###|$))/g);
      for (const m of ceremonies) {
        data.ceremonies.push({
          title: m[1].trim(),
          status: m[2].match(/Státusz:\s*(.+)/)?.[1]?.replace(/\*/g, '').trim() || '',
          place: m[2].match(/Helyszín:\s*(.+)/)?.[1]?.trim() || '',
          time: m[2].match(/Időpont:\s*(.+)/)?.[1]?.trim() || '',
          videoLinks: []
        });
      }

      const matches = md.matchAll(/### (\d+)\.\s*([^-]+)–\s*([^\n(]+)(?:\(([^)]+)\))?([\s\S]*?)(?=(### \d+|\*Utolsó|$))/g);
      for (const m of matches) {
        const content = m[5];
        const events = [];
        const eventLines = content.matchAll(/\*\s*\*\*([^*]+)\*\*:\s*(.+)/g);
        for (const el of eventLines) {
          let text = el[2].trim();
          let icon = '📢';
          if (text.includes('⚽')) icon = '⚽';
          else if (text.includes('🟨')) icon = '🟨';
          else if (text.includes('🟥')) icon = '🟥';
          else if (text.includes('🔄')) icon = '🔄';
          events.push({ time: el[1].trim(), icon, text: text.replace(/^[⚽🟨🟥🔄💧⏸️🏁🧤💥📢\s]+/g, '') });
        }

        data.matches.push({
          id: m[1],
          teamA: m[2].trim(),
          teamB: m[3].trim(),
          group: m[4] ? m[4].trim() : '',
          status: content.match(/Státusz:\s*(.+)/)?.[1]?.replace(/\*/g, '').trim() || '',
          score: content.match(/Eredmény:\s*([^\n]+)/)?.[1]?.replace(/\*/g, '').trim() || '–',
          place: content.match(/Helyszín:\s*(.+)/)?.[1]?.trim() || '',
          events
        });
      }
      return data;
    };

    // --- CARD RENDER FOR BRACKET ---
    const renderBracketCard = (matchId) => {
      const b = state.liveState?.bracket || defaultBracketMatches;
      const m = b[matchId];
      if (!m) return '';

      const isASelected = m.winner && m.winner === m.teamA;
      const isBSelected = m.winner && m.winner === m.teamB;

      const isAPlaceholder = isPlaceholder(m.teamA);
      const isBPlaceholder = isPlaceholder(m.teamB);

      return `
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 shadow-md hover:border-emerald-500/30 transition-all">
          <div class="flex items-center justify-between text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-2 border-b border-slate-800/50 pb-1">
            <span class="flex items-center gap-1.5">
              <span>${m.id} • ${m.date || 'Dátum'}</span>
              ${m.time ? `<span class="text-emerald-400 font-mono font-bold bg-emerald-500/10 px-1 py-0.5 rounded text-[8px]">${m.time}</span>` : ''}
            </span>
            <span class="text-slate-400 font-mono text-[8px]">${m.venue || 'Helyszín'}</span>
          </div>
          <div class="space-y-1.5">
            <!-- TEAM A -->
            <div class="flex items-center justify-between p-1.5 rounded-lg transition-colors ${isASelected ? 'bg-emerald-500/10 border border-emerald-500/20' : 'bg-slate-950/40'}">
              <span class="text-xs truncate max-w-[130px] ${
                isASelected ? 'text-emerald-400 font-black' : isAPlaceholder ? 'text-slate-500 italic font-medium animate-pulse' : 'text-slate-100 font-bold'
              }">${m.teamA}</span>
              <span class="text-xs font-black text-white font-mono bg-slate-950 px-1.5 py-0.5 rounded border border-slate-800">${m.scoreA !== "" ? m.scoreA : "–"}</span>
            </div>
            <!-- TEAM B -->
            <div class="flex items-center justify-between p-1.5 rounded-lg transition-colors ${isBSelected ? 'bg-emerald-500/10 border border-emerald-500/20' : 'bg-slate-950/40'}">
              <span class="text-xs truncate max-w-[130px] ${
                isBSelected ? 'text-emerald-400 font-black' : isBPlaceholder ? 'text-slate-500 italic font-medium animate-pulse' : 'text-slate-100 font-bold'
              }">${m.teamB}</span>
              <span class="text-xs font-black text-white font-mono bg-slate-950 px-1.5 py-0.5 rounded border border-slate-800">${m.scoreB !== "" ? m.scoreB : "–"}</span>
            </div>
          </div>
        </div>
      `;
    };

    // --- HTML RENDER ENGINE ---
    const render = () => {
      const container = document.getElementById('app');
      if (!container) return;

      let html = `
        <!-- HEADER -->
        <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 shadow-lg">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">

                <i data-lucide="flame" class="w-6 h-6 animate-pulse"></i>
              </div>
              <div>
                <h1 class="font-black text-lg tracking-wider bg-gradient-to-r bg-clip-text text-transparent from-emerald-400 to-teal-200">FIFA VB 2026</h1>
                <p class="text-[10px] text-slate-400 font-semibold tracking-widest uppercase">Élő Közvetítő Központ</p>
              </div>
            </div>

            <!-- MENU TABS (Mobil-optimalizált reszponzív navigáció) -->
            <div class="flex items-center space-x-1 sm:space-x-1.5">
              <button id="btn-tab-bracket" class="px-3 py-2 rounded-xl text-xs sm:text-sm font-bold tracking-wide transition-all ${state.activeTab === 'bracket' ? 'bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 shadow-md shadow-emerald-500/10' : 'text-slate-400 hover:text-white hover:bg-slate-800'}">
                <span class="flex items-center space-x-1"><i data-lucide="git-merge" class="w-3.5 h-3.5"></i><span class="hidden xs:inline">Ágrajz</span><span class="xs:hidden">Ág</span></span>
              </button>
              <button id="btn-tab-schedule" class="px-3 py-2 rounded-xl text-xs sm:text-sm font-bold tracking-wide transition-all ${state.activeTab === 'schedule' ? 'bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 shadow-md shadow-emerald-500/10' : 'text-slate-400 hover:text-white hover:bg-slate-800'}">
                <span class="flex items-center space-x-1"><i data-lucide="calendar" class="w-3.5 h-3.5"></i><span class="hidden xs:inline">Időrend</span><span class="xs:hidden">Idő</span></span>
              </button>
              <button id="btn-tab-viewer" class="px-3 py-2 rounded-xl text-xs sm:text-sm font-bold tracking-wide transition-all ${state.activeTab === 'viewer' ? 'bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 shadow-md shadow-emerald-500/10' : 'text-slate-400 hover:text-white hover:bg-slate-800'}">
                <span class="flex items-center space-x-1"><i data-lucide="tv" class="w-3.5 h-3.5"></i><span class="hidden xs:inline">Közvetítés</span><span class="xs:hidden">Élő</span></span>
              </button>
              <button id="btn-tab-admin" class="px-3 py-2 rounded-xl text-xs sm:text-sm font-bold tracking-wide transition-all ${state.activeTab === 'admin' ? 'bg-slate-850 text-emerald-400 border border-emerald-500/20' : 'text-slate-400 hover:text-white hover:bg-slate-800'}">
                <span class="flex items-center space-x-1"><i data-lucide="settings" class="w-3.5 h-3.5"></i><span class="hidden xs:inline">Közvetítő Pult</span><span class="xs:hidden">Gép</span></span>
              </button>
            </div>
          </div>
        </header>

        <!-- STATUS BAR -->
        <div class="bg-slate-900 border-b border-slate-800 text-xs text-slate-400 py-2">
          <div class="max-w-7xl mx-auto px-4 flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center space-x-4">
              <div class="flex items-center space-x-2">

                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full ${state.isConnected ? 'bg-emerald-400' : 'bg-amber-400'} opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2 w-2 ${state.isConnected ? 'bg-emerald-500' : 'bg-amber-500'}"></span>
                </span>
                <span class="font-semibold ${state.isConnected ? 'text-emerald-400' : 'text-amber-400'}">
                  ${state.isConnected ? 'Élő felhő kapcsolat aktív' : 'Helyi mód (Offline)'}
                </span>
              </div>
            </div>
            ${state.isConnected ? `
              <button id="btn-reset-setup" class="text-[10px] text-slate-500 hover:text-rose-400 flex items-center space-x-1">
                <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                <span>Kapcsolat bontása</span>
              </button>
            ` : `
              <span class="text-[10px] text-slate-500">Háttérben szinkronizálunk...</span>
            `}
          </div>
        </div>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1">
      `;

      // --- TAB 1: INTERAKTÍV ÁGRAJZ ---
      if (state.activeTab === 'bracket') {
        html += `
          <div class="space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 border-b border-slate-800 pb-5">
              <div>

                </div>
                <button id="btn-save-all-cloud" ${state.isPublishing ? 'disabled' : ''} class="bg-emerald-500 hover:bg-emerald-400 disabled:bg-slate-800 text-slate-950 font-black py-3 px-6 rounded-xl text-sm transition-all shadow-lg flex items-center justify-center gap-2">
                  ${state.isPublishing ? '<i data-lucide="refresh-cw" class="w-4 h-4 animate-spin"></i>' : '<i data-lucide="upload" class="w-4 h-4"></i>'}
                  <span>Változtatások Élesítése a Weben</span>
                </button>
              </div>

              <!-- ÁGRAJZ MECCSEK SZERKESZTŐJE -->
              <div class="bg-slate-900 border border-slate-800/80 p-6 rounded-3xl space-y-6">
                <h4 class="text-xs text-slate-400 font-black tracking-widest uppercase border-b border-slate-800 pb-3 flex items-center gap-2">
                  <i data-lucide="git-merge" class="text-emerald-400"></i>
                  <span>Kieséses Ágrajz Kezelő Panel</span>
                </h4>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  ${Object.keys(state.liveState?.bracket || defaultBracketMatches).filter(k => k.startsWith('M')).map(key => {
                    const m = (state.liveState?.bracket || defaultBracketMatches)[key];
                    return `
                      <div class="bg-slate-950 p-4 rounded-xl border border-slate-850 space-y-3">
                        <div class="flex items-center justify-between text-xs font-bold text-slate-400">
                          <span class="text-emerald-400 font-black font-mono bg-emerald-500/10 px-2 py-0.5 rounded">
                            ${m.id} • ${m.date || 'Dátum'} ${m.time ? '• ' + m.time : ''}
                          </span>
                          <span>${m.venue || ''}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                          <div>
                            <label class="block text-[9px] text-slate-500 font-bold truncate mb-1">${m.teamA}</label>
                            <input type="text" value="${m.scoreA}" placeholder="Gól" data-match="${m.id}" data-side="A" class="bracket-input w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-xs text-white text-center font-mono focus:border-emerald-500 focus:outline-none" />
                            <button data-match="${m.id}" data-winner="${m.teamA}" class="btn-select-winner w-full mt-2 py-1 rounded text-[9px] font-bold uppercase transition-all ${m.winner === m.teamA ? 'bg-emerald-500 text-slate-950 font-black' : 'bg-slate-900 text-slate-400'}">Továbbjut</button>
                          </div>
                          <div>
                            <label class="block text-[9px] text-slate-500 font-bold truncate mb-1">${m.teamB}</label>
                            <input type="text" value="${m.scoreB}" placeholder="Gól" data-match="${m.id}" data-side="B" class="bracket-input w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-xs text-white text-center font-mono focus:border-emerald-500 focus:outline-none" />
                            <button data-match="${m.id}" data-winner="${m.teamB}" class="btn-select-winner w-full mt-2 py-1 rounded text-[9px] font-bold uppercase transition-all ${m.winner === m.teamB ? 'bg-emerald-500 text-slate-950 font-black' : 'bg-slate-900 text-slate-400'}">Továbbjut</button>
                          </div>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>

              <!-- MANUÁLIS MARKDOWN FELTÖLTÉS -->
              <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-4">
                <div class="flex items-center space-x-2 border-b border-slate-800 pb-3">
                  <i data-lucide="file-text" class="text-emerald-400"></i>
                  <h3 class="font-black text-slate-100">Kézi Közvetítés (Markdown Napló)</h3>
                </div>
                <textarea id="textarea-markdown-input" rows="6" placeholder="Ide másold be az eredménykövető markdown szöveget..." class="w-full bg-slate-950 border border-slate-850 rounded-2xl p-4 text-xs font-mono text-slate-300 focus:outline-none focus:border-emerald-500">${state.markdownInput}</textarea>
                <button id="btn-manual-publish" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 font-black py-3 px-4 rounded-xl text-sm transition-all shadow-lg flex items-center justify-center space-x-2">
                  <i data-lucide="upload"></i>
                  <span>Csoportkör Napló Publikálása</span>
                </button>
              </div>
            </div>
          `;
        }
      }

      if (state.statusMessage) {
        html += `
          <div class="max-w-md mx-auto mt-6 p-4 rounded-2xl border flex items-start space-x-3 text-xs ${state.statusMessage.type === 'success' ? 'bg-emerald-500/10 border-emerald-500/20 text-emerald-400' : 'bg-rose-500/10 border-rose-500/20 text-rose-400'}">
            <i data-lucide="${state.statusMessage.type === 'success' ? 'check' : 'alert-circle'}" class="w-5 h-5 flex-shrink-0"></i>
            <span class="font-semibold">${state.statusMessage.text}</span>
          </div>
        `;
      }

      html += `
        </main>
        <footer class="border-t border-slate-900 bg-slate-950 text-slate-500 text-xs py-8 mt-16">
          <div class="max-w-7xl mx-auto px-4 text-center space-y-2">
            <p class="font-semibold">⚽ FIFA VB 2026 – Valós Idejű Rendszer</p>
            <p class="text-[10px] text-slate-600">Ez a weboldal felhőalapú Firestore adatbázist használ a közvetítések másodperces szinkronizálására.</p>
          </div>
        </footer>
      `;

      container.innerHTML = html;
      lucide.createIcons();

      // --- NAVIGÁCIÓS BINDINGEK ---
      document.getElementById('btn-tab-bracket')?.addEventListener('click', () => { state.activeTab = 'bracket'; render(); });
      document.getElementById('btn-tab-schedule')?.addEventListener('click', () => { state.activeTab = 'schedule'; render(); });
      document.getElementById('btn-tab-viewer')?.addEventListener('click', () => { state.activeTab = 'viewer'; render(); });
      document.getElementById('btn-tab-admin')?.addEventListener('click', () => { state.activeTab = 'admin'; render(); });

      document.getElementById('btn-bracket-left')?.addEventListener('click', () => { state.bracketTab = 'left'; render(); });
      document.getElementById('btn-bracket-right')?.addEventListener('click', () => { state.bracketTab = 'right'; render(); });
      document.getElementById('btn-bracket-finals')?.addEventListener('click', () => { state.bracketTab = 'finals'; render(); });

      // Leválasztás esemény (config törlése)
      document.getElementById('btn-reset-setup')?.addEventListener('click', () => {
        localStorage.removeItem('vb_2026_firebase_config');
        window.location.reload();
      });

      // Login form
      document.getElementById('form-admin-login')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const pwd = document.getElementById('input-admin-password').value;
        state.adminPasswordInput = pwd;
        if (pwd === 'foci2026') {
          state.isAdminAuthenticated = true;
          state.statusMessage = null;
        } else {
          state.statusMessage = { type: 'error', text: 'Helytelen jelszó! Próbáld újra.' };
        }
        render();
      });

      // Kézi konfiguráció mentése a gombra kattintva
      document.getElementById('btn-save-config')?.addEventListener('click', saveFirebaseSetup);

      // Ágrajz inputok figyelése és frissítése
      document.querySelectorAll('.bracket-input').forEach(input => {
        input.addEventListener('input', (e) => {
          const matchId = e.target.dataset.match;
          const side = e.target.dataset.side;
          const val = e.target.value;

          if (!state.liveState) state.liveState = { bracket: JSON.parse(JSON.stringify(defaultBracketMatches)) };
          if (!state.liveState.bracket) state.liveState.bracket = JSON.parse(JSON.stringify(defaultBracketMatches));

          state.liveState.bracket[matchId][`score${side}`] = val;
        });
      });

      // Győztes kiválasztása
      document.querySelectorAll('.btn-select-winner').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const matchId = e.currentTarget.dataset.match;
          const winner = e.currentTarget.dataset.winner;

          if (!state.liveState) state.liveState = { bracket: JSON.parse(JSON.stringify(defaultBracketMatches)) };
          if (!state.liveState.bracket) state.liveState.bracket = JSON.parse(JSON.stringify(defaultBracketMatches));

          const b = state.liveState.bracket;
          b[matchId].winner = winner;

          const nextMatchId = b[matchId].nextMatch;
          const slot = b[matchId].slot;

          if (nextMatchId && slot) {
            b[nextMatchId][slot] = winner;
          }
          render();
        });
      });

      // Változások szinkronizálása a felhővel (Rule 1 & Rule 3)
      document.getElementById('btn-save-all-cloud')?.addEventListener('click', async () => {
        state.isPublishing = true;
        state.statusMessage = { type: 'info', text: 'Feltöltés folyamatban...' };
        render();

        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'live_state', 'current');
          await setDoc(docRef, {
            ...state.liveState,
            updatedAt: new Date().toISOString()
          });
          state.statusMessage = { type: 'success', text: 'Az Ágrajz sikeresen szinkronizálva lett az adatbázissal!' };
        } catch(err) {
          state.statusMessage = { type: 'error', text: 'Hiba a mentés során: ' + err.message };
        } finally {
          state.isPublishing = false;
          render();
        }
      });

      // Manuális Markdown elmentés
      document.getElementById('textarea-markdown-input')?.addEventListener('input', (e) => {
        state.markdownInput = e.target.value;
      });

      document.getElementById('btn-manual-publish')?.addEventListener('click', async () => {
        state.isPublishing = true;
        state.statusMessage = { type: 'info', text: 'Napló publikálása...' };
        render();

        try {
          const parsed = parseMarkdownToJSON(state.markdownInput);
          if (!parsed) throw new Error("A megadott formátum hibás vagy hiányos!");

          if (!state.liveState) state.liveState = { bracket: defaultBracketMatches };
          state.liveState.parsed = parsed;
          state.liveState.rawMarkdown = state.markdownInput;

          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'live_state', 'current');
          await setDoc(docRef, {
            ...state.liveState,
            updatedAt: new Date().toISOString()
          });
          state.statusMessage = { type: 'success', text: 'A Csoportkör Napló sikeresen frissítve lett a weben!' };
        } catch(err) {
          state.statusMessage = { type: 'error', text: err.message };
        } finally {
          state.isPublishing = false;
          render();
        }
      });
    };

    // --- SETUP SAVER ---
    const saveFirebaseSetup = () => {
      const configStr = document.getElementById('setup-config').value;
      const customId = document.getElementById('setup-appid').value;

      try {
        const parsed = JSON.parse(configStr);
        localStorage.setItem('vb_2026_firebase_config', JSON.stringify(parsed));
        localStorage.setItem('vb_2026_appid', customId);
        state.localSetupError = null;
        window.location.reload();
      } catch (e) {
        state.localSetupError = "Hibás konfigurációs formátum. Biztosan érvényes JSON szöveget másoltál be? (Minden kulcsot és szöveges értéket kötelező dupla idézőjelbe tenni!)";
        render();
      }
    };

    // --- INITIALIZER ---
    window.onload = async () => {
      // AZONNALI ELŐ-RENDERELÉS ALAPÉRTELMEZETT ADATOKKAL (0.1 mp betöltési idő!)
      state.liveState = {
        bracket: defaultBracketMatches,
        parsed: { ceremonies: [], matches: [] }
      };
      render();

      let config = null;

      // 1. Vercel Serverless API lekérdezése a háttérben
      try {
        const apiRes = await fetch('/api/config');
        if (apiRes.ok) {
          const apiData = await apiRes.json();
          if (apiData) {
            if (apiData.error) {
              console.warn("Vercel API konfigurációs hibaüzenet:", apiData.error);
              state.vercelApiError = apiData.error;
            }
            if (apiData.firebaseConfig) {
              config = typeof apiData.firebaseConfig === 'string' ? JSON.parse(apiData.firebaseConfig) : apiData.firebaseConfig;
              appId = apiData.appId || 'foci-vb-2026';
            }
          }
        } else {
          console.warn(`Vercel API válasza nem volt sikeres: ${apiRes.status}`);
          state.vercelApiError = `A Vercel API ${apiRes.status} hibát dobott.`;
        }
      } catch (err) {
        console.warn("Vercel API hálózati hiba:", err);
        state.vercelApiError = `Hiba történt az API-val való kommunikáció során: ${err.message}`;
      }

      // 2. Böngésző helyi tárolója (localStorage) mint fallback
      if (!config) {
        const localConfig = localStorage.getItem('vb_2026_firebase_config');
        const localAppId = localStorage.getItem('vb_2026_appid');
        if (localConfig) {
          try {
            config = JSON.parse(localConfig);
            appId = localAppId || 'foci-vb-2026';
          } catch(e) {}
        }
      }

      // Ha nincs konfiguráció egyáltalán, csendben helyi módban maradunk, az ágrajz már látható
      if (!config) {
        return;
      }

      // Firebase példányosítás és szinkronizáció indítása a háttérben
      try {
        const app = initializeApp(config);
        auth = getAuth(app);
        db = getFirestore(app);

        // Névtelen bejelentkezés
        const initAuthAndSync = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }

            // Kapcsolódás a valós idejű zónához (Rule 1)
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'live_state', 'current');
            onSnapshot(docRef, (docSnap) => {
              if (docSnap.exists()) {
                const cloudData = docSnap.data();
                state.liveState = cloudData;
                if (state.liveState.rawMarkdown) {
                  state.markdownInput = state.liveState.rawMarkdown;
                }
              }
              state.isConnected = true; // Sikeres kapcsolat!
              render(); // Újrarajzolás a friss felhő-adatokkal
            }, (err) => {
              console.error("Firestore hiba:", err);
              state.vercelApiError = "Adatbázis hiba: " + err.message;
              render();
            });
          } catch (authErr) {
            console.error("Auth hiba a háttérben:", authErr);
          }
        };

        initAuthAndSync();

      } catch (err) {
        console.error("Csatlakozási hiba:", err);
        state.localSetupError = `Nem sikerült kapcsolódni a megadott Firebase-hez: ${err.message}`;
        render();
      }
    };
  </script>
</body>
</html>
