    };

    // --- IDŐTÚLLÉPÉS KEZELŐ A BLOKKOLT KÉRÉSEKHEZ ---
    const runWithTimeout = (promise, ms = 4000) => {
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => {
          reject(new Error("Időtúllépés hálózati blokkolás miatt"));
        }, ms);
        
        promise.then(
          (res) => { clearTimeout(timer); resolve(res); },
          (err) => { clearTimeout(timer); reject(err); }
        );
      });
    };

    // --- ROBUSZTUS, IDŐZÓNA-FÜGGETLEN DÁTUM- ÉS IDŐKEZELŐ ---
    const parseDateTimeLocal = (str) => {
      const parts = str.split('T');
      const dateParts = parts[0].split('-');
      const timeParts = parts[1].split(':');
      return {
        year: parseInt(dateParts[0]),
        month: parseInt(dateParts[1]),
        day: parseInt(dateParts[2]),
        hour: parseInt(timeParts[0]),
        minute: parseInt(timeParts[1])
      };
    };

    // Virtuális percszámítás a kronológiai rendezéshez (24 órás logikai eltolással)
    const getDateTimeMinutes = (dtStr) => {
      const { year, month, day, hour, minute } = parseDateTimeLocal(dtStr);
      const daysInMonths = [0, 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
      
      let adjustedDay = day;
      let adjustedHour = hour;
      let adjustedMonth = month;
      
      if (hour < 6) {
        // Ha kora hajnali (0:00 - 5:59 CEST) a meccs, virtuálisan az előző nap végére tesszük (+24 óra)
        adjustedHour = hour + 24;
        adjustedDay = day - 1;
        if (adjustedDay === 0) {
          adjustedMonth = month - 1;
          adjustedDay = daysInMonths[adjustedMonth];
        }
      }
      
      let totalDays = adjustedDay;
      for (let i = 1; i < adjustedMonth; i++) {
        totalDays += daysInMonths[i];
      }
      return totalDays * 24 * 60 + adjustedHour * 60 + minute;
    };

    // Csoportosítási játéknap kulcs (0:00 - 5:59 a tegnapi naphoz tartozik)
    const getMatchTournamentDayKey = (dtStr) => {
      let { year, month, day, hour } = parseDateTimeLocal(dtStr);
      if (hour < 6) {
        day -= 1;
        if (day === 0) {
          month -= 1;
          const daysInMonths = [0, 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
          day = daysInMonths[month];
          if (month === 0) {
            month = 12;
            year -= 1;
          }
        }
      }
      return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    };

    const getFormattedGroupHeaderDate = (keyStr) => {
      const [year, month, day] = keyStr.split('-').map(Number);
      const dateObj = new Date(year, month - 1, day);
      return dateObj.toLocaleDateString('hu-HU', { month: 'long', day: 'numeric', weekday: 'long' });
    };

    const getMatchDateTimeString = (m) => {
      if (m.datetime) return m.datetime;
      const defMatch = defaultBracketMatches[m.id];
      return defMatch ? defMatch.datetime : "2026-11-31T00:00";
    };

    // --- CARD RENDER FOR BRACKET ---
    const renderBracketCard = (matchId) => {
      const b = state.liveState?.bracket || defaultBracketMatches;
      const m = b[matchId];
      if (!m) return '';

      const isASelected = m.winner && m.winner === m.teamA;
      const isBSelected = m.winner && m.winner === m.teamB;

      const isAPlaceholder = isPlaceholder(m.teamA);
      const isBPlaceholder = isPlaceholder(m.teamB);

      return `
        <div class="bg-white dark:bg-slate-900 border rounded-xl p-3 shadow-sm dark:shadow-md transition-all duration-200 relative overflow-hidden ${
          m.isLive 
            ? 'border-rose-500 dark:border-rose-500 shadow-rose-500/10 ring-1 ring-rose-500/30' 
            : 'border-slate-200 dark:border-slate-800 hover:border-emerald-500/40 dark:hover:border-emerald-500/30'
        }">
          <div class="flex items-center justify-between text-[9px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-2 border-b border-slate-100 dark:border-slate-800/50 pb-1">
            <span class="flex items-center gap-1.5">
              <span>${m.id} • ${m.date || 'Dátum'}</span>
              ${m.time ? `<span class="text-emerald-600 dark:text-emerald-400 font-mono font-bold bg-emerald-500/10 px-1 py-0.5 rounded text-[8px]">${m.time}</span>` : ''}
            </span>
            ${m.isLive ? `
              <span class="flex items-center gap-1 text-rose-500 font-black tracking-widest animate-pulse text-[8px]">
                <span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span>
                <span>ÉLŐ</span>
              </span>
            ` : m.winner ? `
              <span class="text-emerald-600 dark:text-emerald-400 text-[8px] font-black tracking-wide">VÉGE</span>
            ` : `
              <span class="text-slate-400 dark:text-slate-500 font-mono text-[8px]">${m.venue || 'Helyszín'}</span>
            `}
          </div>
          <div class="space-y-1.5">
            <!-- TEAM A -->
            <div class="flex items-center justify-between p-1.5 rounded-lg transition-colors ${isASelected ? 'bg-emerald-500/10 border border-emerald-500/20' : 'bg-slate-50 dark:bg-slate-950/40'}">
              <span class="text-xs truncate max-w-[130px] ${
                isASelected ? 'text-emerald-600 dark:text-emerald-400 font-black' : isAPlaceholder ? 'text-slate-400 dark:text-slate-500 italic font-medium animate-pulse' : 'text-slate-800 dark:text-slate-100 font-bold'
              }">${m.teamA}</span>
              <div class="flex items-center space-x-1">
                ${m.penaltiesA ? `<span class="text-[9px] font-black text-amber-500">(${m.penaltiesA})</span>` : ''}
                <span class="text-xs font-black text-slate-800 dark:text-white font-mono bg-slate-100 dark:bg-slate-950 px-1.5 py-0.5 rounded border border-slate-200 dark:border-slate-800">${m.scoreA !== "" ? m.scoreA : "–"}</span>
              </div>
            </div>
            <!-- TEAM B -->
            <div class="flex items-center justify-between p-1.5 rounded-lg transition-colors ${isBSelected ? 'bg-emerald-500/10 border border-emerald-500/20' : 'bg-slate-50 dark:bg-slate-950/40'}">
              <span class="text-xs truncate max-w-[130px] ${
                isBSelected ? 'text-emerald-600 dark:text-emerald-400 font-black' : isBPlaceholder ? 'text-slate-400 dark:text-slate-500 italic font-medium animate-pulse' : 'text-slate-800 dark:text-slate-100 font-bold'
              }">${m.teamB}</span>

                ${m.penaltiesB ? `<span class="text-[9px] font-black text-amber-500">(${m.penaltiesB})</span>` : ''}

            </div>
          </div>
        </div>
      `;
    };

                  <label class="block text-[10px] font-black uppercase text-slate-500 dark:text-slate-400 tracking-wider mb-1.5">Egyedi App ID</label>
                  <input type="text" id="setup-appid" value="foci-vb-2026" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-800 dark:text-white focus:outline-none" />
                </div>
                <button id="btn-save-config" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black tracking-wide py-3 px-4 rounded-xl text-sm transition-all shadow-lg flex items-center justify-center space-x-2">
                  <i data-lucide="check"></i>
                  <span>Mentés és Csatlakozás</span>
                </button>
              </div>
            </div>
          `;
        } 
        else {
          html += `
            <div class="max-w-4xl mx-auto space-y-8 animate-fadeIn">
              <!-- Mentés gomb -->
              <div class="bg-white dark:bg-slate-900 border border-slate-250 p-6 rounded-3xl flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 shadow-sm">
                <div>
                  <h3 class="font-black text-lg text-slate-800 dark:text-slate-100 flex items-center gap-2">
                    <i data-lucide="radio" class="text-blue-500 animate-pulse"></i>
                    <span>Közvetítő Panel</span>
                  </h3>
                  <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Módosítsd az ágrajz eredményeit, majd szinkronizáld őket a felhővel.</p>
                </div>
                <button id="btn-save-all-cloud" ${state.isPublishing ? 'disabled' : ''} class="bg-emerald-500 hover:bg-emerald-400 disabled:bg-slate-100 dark:disabled:bg-slate-800 text-slate-950 font-black py-3 px-6 rounded-xl text-sm shadow-lg transition-all flex items-center justify-center gap-2">
                  ${state.isPublishing ? '<i data-lucide="refresh-cw" class="w-4 h-4 animate-spin"></i>' : '<i data-lucide="upload" class="w-4 h-4"></i>'}
                  <span>Változtatások Élesítése a Weben</span>
                </button>
              </div>

              <!-- ÁGRAJZ MECCSEK KEZELŐ PANEL -->
              <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800/80 p-6 rounded-3xl space-y-6 shadow-sm">
                <h4 class="text-xs text-slate-500 dark:text-slate-400 font-black tracking-widest uppercase border-b border-slate-100 dark:border-slate-800 pb-3 flex items-center gap-2">
                  <i data-lucide="git-merge" class="text-emerald-500 dark:text-emerald-400"></i>
                  <span>Kieséses Ágrajz Kezelő Panel</span>
                </h4>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  ${Object.keys(state.liveState?.bracket || defaultBracketMatches).filter(k => k.startsWith('M')).map(key => {
                    const m = (state.liveState?.bracket || defaultBracketMatches)[key];
                    const isDraw = m.scoreA !== "" && m.scoreB !== "" && m.scoreA === m.scoreB;
                    
                    return `
                      <div class="bg-slate-50 dark:bg-slate-950 p-4 rounded-xl border border-slate-200 dark:border-slate-850 space-y-3">
                        <div class="flex items-center justify-between text-xs font-bold text-slate-500 dark:text-slate-400">
                          <span class="text-emerald-600 dark:text-emerald-400 font-black font-mono bg-emerald-500/10 px-2 py-0.5 rounded">
                            ${m.id} • ${m.date || 'Dátum'} ${m.time ? '• ' + m.time : ''}
                          </span>
                          <span>${m.venue || ''}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                          <div>
                            <label class="block text-[9px] text-slate-500 font-bold truncate mb-1">${m.teamA}</label>
                            <input type="text" value="${m.scoreA}" placeholder="Gól" data-match="${m.id}" data-side="A" class="bracket-input w-full bg-white dark:bg-slate-900 border border-slate-250 dark:border-slate-800 rounded-lg px-2 py-1 text-xs text-slate-800 dark:text-white text-center font-mono focus:border-emerald-500 focus:outline-none" />
                            <button data-match="${m.id}" data-winner="${m.teamA}" ${m.isLive ? 'disabled' : ''} class="btn-select-winner w-full mt-2 py-1 rounded text-[9px] font-bold uppercase transition-all ${
                              m.isLive 
                                ? 'bg-slate-100 dark:bg-slate-900 text-slate-300 dark:text-slate-600 cursor-not-allowed border border-slate-200 dark:border-slate-800' 
                                : m.winner === m.teamA 
                                  ? 'bg-emerald-500 text-slate-950 font-black shadow' 
                                  : 'bg-slate-100 dark:bg-slate-900 text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-800'
                            }">Továbbjut</button>
                          </div>
                          <div>
                            <label class="block text-[9px] text-slate-500 font-bold truncate mb-1">${m.teamB}</label>
                            <input type="text" value="${m.scoreB}" placeholder="Gól" data-match="${m.id}" data-side="B" class="bracket-input w-full bg-white dark:bg-slate-900 border border-slate-250 dark:border-slate-800 rounded-lg px-2 py-1 text-xs text-slate-800 dark:text-white text-center font-mono focus:border-emerald-500 focus:outline-none" />
                            <button data-match="${m.id}" data-winner="${m.teamB}" ${m.isLive ? 'disabled' : ''} class="btn-select-winner w-full mt-2 py-1 rounded text-[9px] font-bold uppercase transition-all ${
                              m.isLive 
                                ? 'bg-slate-100 dark:bg-slate-900 text-slate-300 dark:text-slate-600 cursor-not-allowed border border-slate-200 dark:border-slate-800' 
                                : m.winner === m.teamB 
                                  ? 'bg-emerald-500 text-slate-950 font-black shadow' 
                                  : 'bg-slate-100 dark:bg-slate-900 text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-800'
                            }">Továbbjut</button>
                          </div>
                        </div>

                        <!-- Büntetők -->
                        ${isDraw ? `
                          <div class="grid grid-cols-2 gap-2 mt-2 pt-2 border-t border-slate-150 dark:border-slate-800/80 animate-fadeIn">
                            <div>
                              <label class="block text-[9px] text-slate-400 dark:text-slate-500 font-bold mb-1">Büntető (Hazai)</label>
                              <input type="text" value="${m.penaltiesA || ''}" placeholder="Hazai b." data-match="${m.id}" data-pen-side="A" class="bracket-pen-input w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg px-2 py-1 text-xs text-slate-800 dark:text-white text-center font-mono focus:border-emerald-500 focus:outline-none" />
                            </div>
                            <div>
                              <label class="block text-[9px] text-slate-400 dark:text-slate-500 font-bold mb-1">Büntető (Vendég)</label>
                              <input type="text" value="${m.penaltiesB || ''}" placeholder="Vendég b." data-match="${m.id}" data-pen-side="B" class="bracket-pen-input w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg px-2 py-1 text-xs text-slate-800 dark:text-white text-center font-mono focus:border-emerald-500 focus:outline-none" />
                            </div>
                          </div>
                        ` : ''}

                        <!-- Élő gomb -->
                        <div class="mt-2 pt-2 border-t border-slate-100 dark:border-slate-800/80">
                          <button data-match="${m.id}" class="btn-toggle-live w-full py-1.5 rounded text-[10px] font-bold transition-all flex items-center justify-center gap-1 ${
                            m.isLive 
                              ? 'bg-rose-500 text-white animate-pulse font-black' 
                              : 'bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800 hover:bg-rose-500/10'
                          }">
                            <span class="w-1.5 h-1.5 rounded-full ${m.isLive ? 'bg-white' : 'bg-rose-500'}"></span>
                            <span>${m.isLive ? '🔴 Élő közvetítés leállítása' : '🎬 Élő közvetítés indítása'}</span>
                          </button>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            </div>
          `;
        }
      }

      if (state.statusMessage) {
        html += `
          <div class="max-w-md mx-auto mt-6 p-4 rounded-2xl border flex items-start space-x-3 text-xs ${state.statusMessage.type === 'success' ? 'bg-emerald-500/10 border-emerald-500/20 text-emerald-600 dark:text-emerald-400 animate-fadeIn' : 'bg-rose-500/10 border-rose-500/20 text-rose-600 dark:text-rose-400 animate-fadeIn'}">
            <i data-lucide="${state.statusMessage.type === 'success' ? 'check' : 'alert-circle'}" class="w-5 h-5 flex-shrink-0"></i>
            <span class="font-semibold">${state.statusMessage.text}</span>
          </div>
        `;
      }

      html += `
        </main>
        <footer class="border-t border-slate-200 dark:border-slate-900 bg-white dark:bg-slate-950 text-slate-400 dark:text-slate-500 text-xs py-8 mt-16 transition-colors">
          <div class="max-w-7xl mx-auto px-4 text-center space-y-2">
            <p class="font-semibold">⚽ FIFA VB 2026 – Valós Idejű Rendszer</p>
            <p class="text-[10px] text-slate-400 dark:text-slate-600">Ez a weboldal felhőalapú Firestore adatbázist használ a közvetítések másodperces szinkronizálására.</p>
          </div>
        </footer>
      `;

      container.innerHTML = html;
      lucide.createIcons();

      // --- NAVIGÁCIÓS BINDINGEK ---
      document.getElementById('btn-tab-bracket')?.addEventListener('click', () => { state.activeTab = 'bracket'; render(); });
      document.getElementById('btn-tab-schedule')?.addEventListener('click', () => { state.activeTab = 'schedule'; render(); });
      document.getElementById('btn-tab-admin')?.addEventListener('click', () => { state.activeTab = 'admin'; render(); });

      document.getElementById('btn-bracket-left')?.addEventListener('click', () => { state.bracketTab = 'left'; render(); });
      document.getElementById('btn-bracket-right')?.addEventListener('click', () => { state.bracketTab = 'right'; render(); });
      document.getElementById('btn-bracket-finals')?.addEventListener('click', () => { state.bracketTab = 'finals'; render(); });

      // Téma váltás
      document.getElementById('btn-toggle-theme')?.addEventListener('click', toggleTheme);

      // Leválasztás
      document.getElementById('btn-reset-setup')?.addEventListener('click', () => {
        localStorage.removeItem('vb_2026_firebase_config');
        window.location.reload();
      });

      // Login form (SanyiVB2026 jelszó)
      document.getElementById('form-admin-login')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const pwd = document.getElementById('input-admin-password').value;
        state.adminPasswordInput = pwd;
        if (pwd === 'SanyiVB2026') {
          state.isAdminAuthenticated = true;
          state.statusMessage = null;
        } else {
          state.statusMessage = { type: 'error', text: 'Helytelen jelszó! Próbáld újra.' };
        }
        render();
      });

      // Ágrajz inputok figyelése
      document.querySelectorAll('.bracket-input').forEach(input => {
        input.addEventListener('input', (e) => {
          const matchId = e.target.dataset.match;
          const side = e.target.dataset.side;
          const val = e.target.value;

          if (!state.liveState) state.liveState = { bracket: JSON.parse(JSON.stringify(defaultBracketMatches)) };
          if (!state.liveState.bracket) state.liveState.bracket = JSON.parse(JSON.stringify(defaultBracketMatches));

          state.liveState.bracket[matchId][`score${side}`] = val;
        });
      });

      // Büntető inputok figyelése
      document.querySelectorAll('.bracket-pen-input').forEach(input => {
        input.addEventListener('input', (e) => {
          const matchId = e.target.dataset.match;
          const side = e.target.dataset.penSide;
          const val = e.target.value;

          if (!state.liveState) state.liveState = { bracket: JSON.parse(JSON.stringify(defaultBracketMatches)) };
          if (!state.liveState.bracket) state.liveState.bracket = JSON.parse(JSON.stringify(defaultBracketMatches));

          state.liveState.bracket[matchId][`penalties${side}`] = val;
        });
      });

      // Élő kapcsoló indítása/leállítása
      document.querySelectorAll('.btn-toggle-live').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const matchId = e.currentTarget.dataset.match;

          if (!state.liveState) state.liveState = { bracket: JSON.parse(JSON.stringify(defaultBracketMatches)) };
          if (!state.liveState.bracket) state.liveState.bracket = JSON.parse(JSON.stringify(defaultBracketMatches));

          const currentLiveState = !state.liveState.bracket[matchId].isLive;
          state.liveState.bracket[matchId].isLive = currentLiveState;
          if (currentLiveState) {
            state.liveState.bracket[matchId].winner = "";
          }
          render();
        });
      });

      // Győztes kiválasztása
      document.querySelectorAll('.btn-select-winner').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const matchId = e.currentTarget.dataset.match;
          const winner = e.currentTarget.dataset.winner;

          if (!state.liveState) state.liveState = { bracket: JSON.parse(JSON.stringify(defaultBracketMatches)) };
          if (!state.liveState.bracket) state.liveState.bracket = JSON.parse(JSON.stringify(defaultBracketMatches));

          const b = state.liveState.bracket;
          b[matchId].winner = winner;
          b[matchId].isLive = false;

          const nextMatchId = b[matchId].nextMatch;
          const slot = b[matchId].slot;

          if (nextMatchId && slot) {
            b[nextMatchId][slot] = winner;
          }
          render();
        });
      });

      // Változások szinkronizálása a felhővel (Rule 1 & Rule 3 + Időkorlát és részletes hibajelzés)
      document.getElementById('btn-save-all-cloud')?.addEventListener('click', async () => {
        state.isPublishing = true;
        state.statusMessage = { type: 'info', text: 'Feltöltés folyamatban...' };
        render();

        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'live_state', 'current');
          const savePromise = setDoc(docRef, {
            bracket: state.liveState?.bracket || defaultBracketMatches,
            updatedAt: new Date().toISOString()
          });
          
          await runWithTimeout(savePromise, 5000);
          state.statusMessage = { type: 'success', text: 'Az Ágrajz és minden módosítás sikeresen szinkronizálva lett az adatbázissal!' };
        } catch(err) {
          console.error("Mentési hiba részletei:", err);
          let errMsg = err.message;
          
          if (err.code === 'permission-denied' || err.message.toLowerCase().includes('permission') || err.message.toLowerCase().includes('insufficient')) {
            errMsg = "Hozzáférés megtagadva! A Firebase biztonsági szabályai (Rules) lejártak, vagy a Névtelen Bejelentkezés nincs engedélyezve. Kérlek, állítsd be a szabályokat a Firebase Console-ban az útmutatónk alapján!";
          } else if (err.message.includes("Időtúllépés")) {
            errMsg = "Időtúllépés! A Google szerverek nem válaszoltak időben. Ha Brave böngészőt használsz, győződj meg róla, hogy teljesen kikapcsoltad a narancssárga oroszlán ikonos 'Brave Shields' pajzsot!";
          }
          
          state.statusMessage = { type: 'error', text: errMsg };
        } finally {
          state.isPublishing = false;
          render();
        }
      });
    };

    // --- TÉMA VÁLTÓ ---
    const toggleTheme = () => {
      state.theme = state.theme === 'light' ? 'dark' : 'light';
      localStorage.setItem('vb_2026_theme', state.theme);
      applyTheme();
      render();
    };

    const applyTheme = () => {
      if (state.theme === 'dark') {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
      } else {
        document.documentElement.classList.add('light');
        document.documentElement.classList.remove('dark');
      }
    };

    // --- SETUP SAVER ---
    const saveFirebaseSetup = () => {
      const configStr = document.getElementById('setup-config').value;
      const customId = document.getElementById('setup-appid').value;

      try {
        const parsed = JSON.parse(configStr);
        localStorage.setItem('vb_2026_firebase_config', JSON.stringify(parsed));
        localStorage.setItem('vb_2026_appid', customId);
        state.localSetupError = null;
        window.location.reload();
      } catch (e) {
        state.localSetupError = "Hibás konfigurációs formátum. Biztosan érvényes JSON szöveget másoltál be?";
        render();
      }
    };

    // --- INITIALIZER ---
    window.onload = async () => {
      // Téma beállítása (alapértelmezett: light)
      const savedTheme = localStorage.getItem('vb_2026_theme');
      state.theme = savedTheme || 'light';
      applyTheme();

      // Azonnali elő-renderelés
      state.liveState = {
        bracket: JSON.parse(JSON.stringify(defaultBracketMatches)),
        parsed: { ceremonies: [], matches: [] }
      };
      render();

      let config = null;

      // 1. Vercel API lekérdezése
      try {
        const apiRes = await fetch('/api/config');
        if (apiRes.ok) {
          const apiData = await apiRes.json();
          if (apiData && apiData.firebaseConfig) {
            config = typeof apiData.firebaseConfig === 'string' ? JSON.parse(apiData.firebaseConfig) : apiData.firebaseConfig;
            appId = apiData.appId || 'foci-vb-2026';
          }
        }
      } catch (err) {
        console.warn("Vercel API hiba, helyi beállítások ellenőrzése...");
      }

      // 2. Erős fallback a helyi tárolóból (localStorage)
      if (!config) {
        const localConfig = localStorage.getItem('vb_2026_firebase_config');
        const localAppId = localStorage.getItem('vb_2026_appid');
        if (localConfig) {
          try {
            config = JSON.parse(localConfig);
            appId = localAppId || 'foci-vb-2026';
          } catch(e) {}
        }
      }

      if (!config) {
        return;
      }

      // Firebase példányosítás és valós idejű szinkron
      try {
        const app = initializeApp(config);
        auth = getAuth(app);
        db = getFirestore(app);

        // Névtelen bejelentkezés végrehajtása
        const initAuthAndSync = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }

            // Kapcsolódás a valós idejű zónához (Rule 1)
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'live_state', 'current');
            onSnapshot(docRef, (docSnap) => {
              if (docSnap.exists()) {
                const data = docSnap.data();
                if (data && data.bracket) {
                  // Biztonságos merge: a statikus menetrendi adatokat mindig a helyi defaultBracketMatches-ből kényszerítjük ki
                  for (const key in data.bracket) {
                    if (defaultBracketMatches[key]) {
                      data.bracket[key].date = defaultBracketMatches[key].date;
                      data.bracket[key].time = defaultBracketMatches[key].time;
                      data.bracket[key].datetime = defaultBracketMatches[key].datetime;
                      data.bracket[key].venue = defaultBracketMatches[key].venue;
                    }
                  }
                }
                state.liveState = data;
              } else {
                state.liveState = {
                  bracket: JSON.parse(JSON.stringify(defaultBracketMatches))
                };
              }
              state.isConnected = true;
              render();
            }, (err) => {
              console.error("Firestore hiba:", err);
            });
          } catch (authErr) {
            console.error("Auth hiba a háttérben:", authErr);
          }
        };

        initAuthAndSync();

      } catch (err) {
        console.error("Csatlakozási hiba:", err);
      }
    };
  </script>
</body>
</html>
